AWSTemplateFormatVersion: '2010-09-09'
Description: HTTP API managed with AWS CloudFormation for the TEL351 laboratory

Parameters:
  StudentId:
    Type: String
    Description: Normalized RUT without dots or hyphen and with a lowercase verification digit
    AllowedPattern: '^[0-9]{7,8}[0-9k]$'
    ConstraintDescription: Enter a normalized RUT using digits and a final digit or lowercase k

  StatusMessage:
    Type: String
    Description: Message returned by the status route
    Default: API-managed-by-CloudFormation
    MinLength: 1
    MaxLength: 120

  EnableEcho:
    Type: String
    Description: Create the resources used by the echo route
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  EnableEchoCondition: !Equals
    - !Ref EnableEcho
    - 'true'

Resources:
  FunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRol

  ArchiveBucket:
    Type: AWS::S3::Bucket

  StatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tel351-clf-status
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt FunctionExecutionRole.Arn
      Environment:
        Variables:
          MESSAGE: !Ref StatusMessage
          STUDENT_ID: !Ref StudentId
          ARCHIVE_BUCKET: !Ref ArchiveBucket
      Code:
        ZipFile: |
          import json
          import os


          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps({
                      "status": "operational",
                      "message": os.environ["MESSAGE"],
                      "studentId": os.environ["STUDENT_ID"],
                      "archiveBucket": os.environ["ARCHIVE_BUCKET"],
                  }),
              }

  EchoFunction:
    Type: AWS::Lambda::Function
    Condition: EnableEchoCondition
    Properties:
      FunctionName: tel351-clf-echo
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt FunctionExecutionRole.Arn
      Code:
        ZipFile: |
          import json


          def lambda_handler(event, context):
              parameters = event.get("pathParameters") or {}
              message = parameters.get("message", "")

              return {
                  "statusCode": 200,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps({"message": message}),
              }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: tel351-clf
      ProtocolType: HTTP
      RouteKey: GET /status
      Target: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StatusFunction.Arn}/invocations'

  StatusInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StatusFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/status'

  EchoIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: EnableEchoCondition
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EchoFunction.Arn
      PayloadFormatVersion: '3.0'

  EchoRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: EnableEchoCondition
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /echo/{message}
      Target: !Sub 'integrations/${EchoIntegration}'

  EchoInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: EnableEchoCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EchoFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/echo/*'

Outputs:
  ApiUrl:
    Description: Base URL assigned to the HTTP API
    Value: !GetAtt HttpApi.ApiEndpoint

  StatusUrl:
    Description: URL of the status route
    Value: !Sub '${HttpApi.ApiEndpoint}/status'

  EchoUrl:
    Condition: EnableEchoCondition
    Description: URL pattern of the echo route
    Value: !Sub '${HttpApi.ApiEndpoint}/echo/{message}'

  ArchiveBucketName:
    Description: Name of the bucket used by the API
    Value: !Ref ArchiveBucket
